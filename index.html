<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ذكاء اسكيب مشن</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { --gold: #FFD700; --black: #000000; }
        body { font-family: 'Tajawal', sans-serif; background-color: var(--black); color: var(--gold); display: flex; flex-direction: column; align-items: center; margin: 0; min-height: 100vh; padding: 20px; }
        .chat-container { width: 100%; max-width: 600px; display: flex; flex-direction: column; gap: 15px; }
        #chat-history { flex-grow: 1; margin-bottom: 100px; display: flex; flex-direction: column; gap: 10px; width: 100%; }
        .message { padding: 12px 18px; border-radius: 15px; max-width: 80%; line-height: 1.6; }
        .user-msg { background: #333; align-self: flex-end; border-bottom-right-radius: 2px; }
        .ai-msg { background: var(--gold); color: #000; align-self: flex-start; border-bottom-left-radius: 2px; }
        .input-area { position: fixed; bottom: 20px; width: 100%; max-width: 600px; display: flex; gap: 10px; background: #000; padding: 10px; border-top: 1px solid #333; box-sizing: border-box; }
        input { flex-grow: 1; padding: 15px; border-radius: 12px; border: 2px solid var(--gold); background: #111; color: var(--gold); font-family: 'Tajawal'; font-weight: bold; }
        button { background: var(--gold); color: #000; padding: 0 25px; border-radius: 12px; border: none; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <h2 style="margin-top: 10px;">ذكاء اسكيب مشن 🤖</h2>

    <div class="chat-container">
        <div id="chat-history">
            <div class="message ai-msg">أهلاً بك في اسكيب مشن! كيف أساعدك اليوم؟ 🫡</div>
        </div>
    </div>

    <div class="input-area">
        <input type="text" id="userInput" placeholder="اكتب رسالتك..." onkeypress="if(event.key==='Enter') askAI()">
        <button onclick="askAI()">إرسال</button>
    </div>

    <script>
        const sessionId = 'sess_' + Math.random().toString(36).substr(2, 9);

        async function askAI() {
            const input = document.getElementById('userInput');
            if (!input.value.trim()) return;

            const userText = input.value;
            appendMessage(userText, 'user-msg');
            input.value = ""; 

            const loadingId = 'loading-' + Date.now();
            appendMessage("⏳ جاري التفكير...", 'ai-msg', loadingId);

            try {
                const res = await fetch('https://voxa-3a7ac828dfb6.herokuapp.com/webhook/9e69bf82-0dfa-4a70-aab9-fb169d28e3e5', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        chatInput: userText,
                        sessionId: sessionId 
                    })
                });
                
                const data = await res.json();
                console.log("البيانات المستلمة:", data); // مفيد جداً للتشخيص!
                
                // هنا نقوم بعرض البيانات الخام إذا لم نجد نصاً واضحاً
                const msgElement = document.getElementById(loadingId);
                msgElement.innerText = data.output || data.text || data.response || JSON.stringify(data);
                
            } catch (e) {
                document.getElementById(loadingId).innerText = "حدث خطأ في الاتصال، تأكد من n8n.";
            }
            window.scrollTo(0, document.body.scrollHeight);
        }

        function appendMessage(text, className, id = "") {
            const div = document.createElement('div');
            div.className = `message ${className}`;
            if(id) div.id = id;
            div.innerText = text;
            document.getElementById('chat-history').appendChild(div);
            window.scrollTo(0, document.body.scrollHeight);
        }
    </script>
</body>
</html>
