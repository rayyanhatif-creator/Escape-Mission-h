<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ذكاء اسكيب مشن</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { --gold: #FFD700; --black: #000000; }
        body { font-family: 'Tajawal', sans-serif; background-color: var(--black); color: var(--gold); display: flex; flex-direction: column; align-items: center; margin: 0; min-height: 100vh; padding: 20px; }
        
        .chat-container { width: 100%; max-width: 600px; display: flex; flex-direction: column; gap: 15px; }
        #chat-history { flex-grow: 1; margin-bottom: 80px; display: flex; flex-direction: column; gap: 10px; }
        
        .message { padding: 12px 18px; border-radius: 15px; max-width: 80%; }
        .user-msg { background: #333; align-self: flex-end; }
        .ai-msg { background: var(--gold); color: #000; align-self: flex-start; }

        .input-area { position: fixed; bottom: 20px; width: 100%; max-width: 600px; display: flex; gap: 10px; background: #000; padding: 10px; border-top: 1px solid #333; }
        input { flex-grow: 1; padding: 15px; border-radius: 12px; border: 2px solid var(--gold); background: #111; color: var(--gold); font-family: 'Tajawal'; font-weight: bold; }
        button { background: var(--gold); color: #000; padding: 0 25px; border-radius: 12px; border: none; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <h2 style="margin-top: 10px;">ذكاء اسكيب مشن 🤖</h2>

    <div class="chat-container">
        <div id="chat-history">
            <div class="message ai-msg">أهلاً بك في اسكيب مشن، كيف أساعدك اليوم؟</div>
        </div>
    </div>

    <div class="input-area">
        <input type="text" id="userInput" placeholder="اكتب رسالتك..." onkeypress="if(event.key==='Enter') askAI()">
        <button onclick="askAI()">إرسال</button>
    </div>

    <script>
        async function askAI() {
            const input = document.getElementById('userInput');
            const history = document.getElementById('chat-history');
            
            if (!input.value.trim()) return;

            // إضافة رسالة المستخدم
            const userText = input.value;
            appendMessage(userText, 'user-msg');
            input.value = ""; 

            // إضافة مؤشر جاري الكتابة
            const loadingId = 'loading-' + Date.now();
            appendMessage("⏳...", 'ai-msg', loadingId);

            try {
                const res = await fetch('https://voxa-3a7ac828dfb6.herokuapp.com/webhook-test/9e69bf82-0dfa-4a70-aab9-fb169d28e3e5', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ chatInput: userText })
                });
                const data = await res.json();
                document.getElementById(loadingId).innerText = data.output || data.text || "تم الاستلام!";
            } catch (e) {
                document.getElementById(loadingId).innerText = "حدث خطأ، حاول مجدداً.";
            }
        }

        function appendMessage(text, className, id = "") {
            const div = document.createElement('div');
            div.className = `message ${className}`;
            if(id) div.id = id;
            div.innerText = text;
            document.getElementById('chat-history').appendChild(div);
            window.scrollTo(0, document.body.scrollHeight);
        }
    </script>
</body>
</html>
