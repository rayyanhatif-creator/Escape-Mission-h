<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ذكاء العز | طلبات</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { --gold: #FFD700; --black: #000000; }
        body { font-family: 'Tajawal', sans-serif; background-color: var(--black); color: var(--gold); display: flex; justify-content: center; align-items: center; margin: 0; min-height: 100vh; padding: 20px; }
        
        .order-container { background: #121212; border: 1px solid var(--gold); width: 100%; max-width: 500px; padding: 30px; border-radius: 30px; text-align: center; box-sizing: border-box; }
        input { width: 100%; padding: 15px; border-radius: 12px; border: 2px solid var(--gold); background: #000; color: var(--gold); margin-top: 15px; font-family: 'Tajawal'; font-weight: bold; text-align: center; font-size: 16px; box-sizing: border-box; }
        button { width: 100%; background: var(--gold); color: #000; padding: 15px; border-radius: 12px; border: none; font-weight: bold; cursor: pointer; font-size: 18px; margin-top: 15px; }
        
        #ai-reply-box { display: none; margin-top: 20px; padding: 20px; background: #fff; color: #000; border-radius: 20px; border: 4px solid var(--gold); font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <div class="order-container">
        <h3>ذكاء العز 🤖</h3>
        <input type="text" id="userInput" placeholder="وش بخاطرك؟" onkeypress="if(event.key==='Enter') askAI()">
        <button onclick="askAI()">إرسال الطلب</button>
        
        <div id="ai-reply-box" onclick="resetAll()">
            <div id="ai-text"></div>
            <div style="font-size: 10px; margin-top: 15px; color: #999;">(اضغط للمسح)</div>
        </div>
    </div>

    <script>
        async function askAI() {
            const input = document.getElementById('userInput');
            const box = document.getElementById('ai-reply-box');
            const text = document.getElementById('ai-text');
            
            if (!input.value.trim()) return;

            const currentMessage = input.value;
            input.value = ""; 
            
            box.style.display = "block";
            text.innerText = "⏳ جاري التجهيز...";

            try {
                const res = await fetch('https://voxa-3a7ac828dfb6.herokuapp.com/webhook/f679c772-d169-4e46-a1cd-35bd223dc4b6', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ chatInput: currentMessage })
                });
                const data = await res.json();
                text.innerText = data.output || data.text || "تم استلام طلبك!";
            } catch (e) {
                text.innerText = "أبشر، طلبك وصل!";
            }
        }

        function resetAll() {
            document.getElementById('ai-reply-box').style.display = "none";
            document.getElementById('userInput').value = "";
        }
    </script>
</body>
</html>
